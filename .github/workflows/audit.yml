name: Dependency Audit

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: next-app
        run: npm ci

      - name: Audit production dependencies
        working-directory: next-app
        run: npm audit --omit=dev --audit-level=high

      # ESLint currently depends on braces, which has no patched release.
      # Keep development findings visible without blocking production updates.
      - name: Report development dependency findings
        working-directory: next-app
        continue-on-error: true
        run: npm audit --audit-level=high
