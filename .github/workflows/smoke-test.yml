name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: next-app
        run: npm ci

      - name: Build
        working-directory: next-app
        run: npm run build

      - name: Start server
        working-directory: next-app
        env:
          RESUME_EDITOR_BYPASS_LOGIN: "1"
          RESUME_EDITOR_SESSION_SECRET: ci-smoke-test-secret
          PORT: "3100"
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - name: Run smoke test
        working-directory: next-app
        env:
          SMOKE_TEST_BASE_URL: http://localhost:3100
        run: node scripts/smoke-test.js
