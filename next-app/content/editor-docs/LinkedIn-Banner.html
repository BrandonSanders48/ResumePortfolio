<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brandon Sanders – LinkedIn Banner</title>
<style>
/* Self-hosted, both families, rather than pulled from Google Fonts. Chromium's
   PDF export embeds a self-hosted @font-face as a low-quality Type3 bitmap
   font -- heavier and blurrier than the live page -- specifically when the
   *same document* also loads a font from a Google Fonts <link>. Mixing
   "external stylesheet font" and "inline @font-face font" is what trips it,
   not either alone; self-hosting only Fraunces while still pulling Inter
   from Google still reproduced it. Self-hosting everything avoids the mix. */
@font-face {
  font-family: "Inter";
  font-weight: 400;
  font-display: swap;
  src: url("/files/fonts/Inter-Regular.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-weight: 500;
  font-display: swap;
  src: url("/files/fonts/Inter-Medium.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-weight: 600;
  font-display: swap;
  src: url("/files/fonts/Inter-SemiBold.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-weight: 700;
  font-display: swap;
  src: url("/files/fonts/Inter-Bold.woff2") format("woff2");
}
@font-face {
  font-family: "Fraunces";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("/files/fonts/Fraunces-SemiBold.woff2") format("woff2");
}
@font-face {
  font-family: "Fraunces";
  font-style: italic;
  font-weight: 600;
  font-display: swap;
  src: url("/files/fonts/Fraunces-SemiBoldItalic.woff2") format("woff2");
}
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
  }

  .banner {
    width: 1584px;
    height: 396px;
    background: #eef1f6;
    border-bottom: 10px solid #3f6b66;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 120px;
    position: relative;
    overflow: hidden;
  }

  /* Grid texture, matches the site's homepage hero background. No
     mask-image: headless Chromium's PDF/print pipeline can silently drop
     masked layers depending on the host's compositor, while a normal
     alpha-blended background gradient always rasterizes. */
  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(20, 23, 31, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20, 23, 31, 0.1) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  .banner > * {
    position: relative;
    z-index: 1;
  }

  .banner > .header-particles {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .banner > .banner-fade {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(to left, transparent 0%, transparent 45%, #eef1f6 92%);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .logo {
    width: 130px;
    height: 130px;
    border-radius: 32px;
    background: #14171f;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-size: 58px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
  }

  .logo span {
    position: absolute;
    right: 20px;
    bottom: 22px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #3f6b66;
  }

  .divider-v {
    width: 2px;
    height: 120px;
    background: #dfe3ea;
    flex-shrink: 0;
  }

  .name-block {
    color: #14171f;
  }

  .name-block h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 52px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: 0.5px;
  }

  .name-block h1 em {
    font-style: italic;
  }

  .name-block h2 {
    margin-top: 14px;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    border-top: 1px solid #dfe3ea;
    padding-top: 14px;
    color: rgba(20, 23, 31, 0.6);
  }

  /* Export instructions overlay - hidden when printing */
  .instructions {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-family: monospace;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 6px;
    white-space: nowrap;
  }

  @media print {
    body { background: none; margin: 0; min-height: unset; }
    .instructions { display: none; }
    .banner { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="banner">
  <canvas class="header-particles" aria-hidden="true"></canvas>
  <div class="banner-fade" aria-hidden="true"></div>
  <div class="brand">
    <div class="logo">BS<span></span></div>
    <div class="divider-v"></div>
    <div class="name-block">
      <h1>Brandon Sanders, <em>CISSP</em></h1>
      <h2>IT Security Leader &nbsp;|&nbsp; Risk &amp; Compliance &nbsp;|&nbsp; Infrastructure Strategy</h2>
    </div>
  </div>

</div>

<div class="instructions">
  To export: zoom browser to 100% &rarr; screenshot the banner &rarr; crop to 1584&times;396 px &nbsp;|&nbsp; LinkedIn banner size: 1584&times;396
</div>

<script>
(function () {
  var INK = [20, 23, 31];
  var ACCENT = [63, 107, 102];
  var LINK_DISTANCE = 110;
  var SPEED = 0.5;

  function initCanvas(canvas) {
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var width = 0, height = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), particles = [], rafId = 0;

    function seed() {
      var parent = canvas.parentElement;
      if (!parent) return;
      width = parent.clientWidth;
      height = parent.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var count = Math.round((width * height) / 9000);
      particles = [];
      for (var i = 0; i < Math.min(count, 55); i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * SPEED,
          vy: (Math.random() - 0.5) * SPEED,
          color: Math.random() < 0.82 ? INK : ACCENT,
          r: Math.random() * 1.2 + 1
        });
      }
    }

    function step() {
      ctx.clearRect(0, 0, width, height);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;
        p.x = Math.max(0, Math.min(width, p.x));
        p.y = Math.max(0, Math.min(height, p.y));
      }

      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var a = particles[i], b = particles[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < LINK_DISTANCE) {
            var alpha = (1 - dist / LINK_DISTANCE) * 0.28;
            ctx.strokeStyle = "rgba(" + INK[0] + "," + INK[1] + "," + INK[2] + "," + alpha + ")";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.fillStyle = "rgba(" + p.color[0] + "," + p.color[1] + "," + p.color[2] + ",0.6)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!reduceMotion) rafId = requestAnimationFrame(step);
    }

    seed();
    step();

    window.addEventListener("resize", function () {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      seed();
      if (reduceMotion) step();
    });
  }

  function init() {
    var canvases = document.querySelectorAll(".header-particles");
    for (var i = 0; i < canvases.length; i++) initCanvas(canvases[i]);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
